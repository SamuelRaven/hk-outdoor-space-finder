<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天氣角標全效果預覽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      background: #fff; color: #000;
      padding: 28px 16px 56px;
      max-width: 960px; margin: 0 auto;
    }
    .hd { border-left: 10px solid #F6B81F; padding-left: 14px; margin-bottom: 6px; }
    h1 { font-family: 'Josefin Sans', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.15; }
    .subhead { font-size: 13px; opacity: 0.6; margin: 6px 0 24px 24px; }
    .legend { font-size: 12px; opacity: 0.7; margin: 0 0 20px 24px; line-height: 1.7; }
    .legend b { font-weight: 700; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card { border: 1px solid #000; background: #fff; }

    .hero {
      position: relative; overflow: hidden;
      background: #fff; border-bottom: 1px solid #000;
      border-left: 8px solid #000;
      padding: 16px 14px; height: 122px;
    }
    .hero__name {
      position: relative; z-index: 1;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 18px; font-weight: 700; line-height: 1.2;
    }
    .hero__meta {
      position: relative; z-index: 1;
      font-size: 12px; opacity: 0.5; margin-top: 8px;
    }

    /* 與 components.css 完全一致的角標定位 */
    .hero__weather { position: absolute; z-index: 0; pointer-events: none; }
    .hero__weather--corner { top: -64px; right: -64px; width: 150px; height: 150px; }
    .hero__weather--inline { top: 12px; right: 12px; width: 56px; height: 56px; }
    .hero__weather svg { width: 100%; height: 100%; display: block; }

    .label {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 14px; font-weight: 700;
      padding: 10px 12px 2px;
    }
    .sub { font-size: 11px; padding: 2px 12px 12px; opacity: 0.6; line-height: 1.6; }
    .sub .mode { color: #000; font-weight: 700; opacity: 1; }

    /* 天氣動效（與 components.css 一致） */
    .weather-sun-rays { transform-box: fill-box; transform-origin: center; animation: weather-spin 28s linear infinite; }
    .weather-cloud-drift { transform-box: fill-box; transform-origin: center; animation: weather-billow 7s ease-in-out infinite; }
    .weather-rain { animation: weather-rain-fall 1s linear infinite; }
    .weather-rain.weather-slow { animation-duration: 1.7s; }
    .weather-rain.weather-fast { animation-duration: 0.65s; }
    .weather-lightning { animation: weather-flash 2.6s linear infinite; }
    .weather-fog { animation: weather-fog-drift 5s ease-in-out infinite; }
    .weather-star { animation: weather-twinkle 2.4s ease-in-out infinite; }
    .weather-d2 { animation-delay: 0.35s; }
    .weather-d3 { animation-delay: 0.7s; }
    .weather-d4 { animation-delay: 1.05s; }
    .weather-d5 { animation-delay: 1.4s; }
    @keyframes weather-spin { to { transform: rotate(360deg); } }
    @keyframes weather-billow { 0%, 100% { transform: translateX(0) scale(1); } 50% { transform: translateX(9px) scale(1.08); } }
    @keyframes weather-rain-fall { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(46px); opacity: 0; } }
    @keyframes weather-flash { 0%, 55%, 100% { opacity: 0.15; } 60%, 68% { opacity: 1; } 72% { opacity: 0.3; } 78%, 82% { opacity: 1; } 86% { opacity: 0.2; } }
    @keyframes weather-fog-drift { 0%, 100% { transform: translateX(0); opacity: 0.7; } 50% { transform: translateX(14px); opacity: 1; } }
    @keyframes weather-twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="hd"><h1>天氣角標 · 全效果預覽</h1></div>
  <div class="subhead">詳情頁 hero 右上角實時天氣角標（與實際代碼 <code>js/core/weather-icons.js</code> 共用同一份 SVG）</div>
  <div class="legend">
    <b>溢出角標</b>：白天晴天（太陽只露約 1/3，被 hero 裁切）<br />
    <b>內嵌角標</b>：其餘天氣（月亮／雲／霧／雨／雷暴）完整展現
  </div>

  <div class="grid" id="grid"></div>

  <script type="module">
    import { weatherIcon } from './js/core/weather-icons.js?v=1';

    const variants = [
      { name: '晴 · 白天', code: 0,  isDay: true  },
      { name: '晴 · 夜晚', code: 0,  isDay: false },
      { name: '多雲 · 白天', code: 2,  isDay: true  },
      { name: '多雲 · 夜晚', code: 2,  isDay: false },
      { name: '陰',        code: 3,  isDay: true  },
      { name: '霧',        code: 45, isDay: true  },
      { name: '小雨',      code: 61, isDay: true  },
      { name: '中雨',      code: 63, isDay: true  },
      { name: '大雨',      code: 65, isDay: true  },
      { name: '雷暴',      code: 95, isDay: true  },
    ];

    const grid = document.getElementById('grid');
    for (const v of variants) {
      const isCorner = v.isDay && (v.code === 0 || v.code === 1);
      const mode = isCorner ? 'corner' : 'inline';
      const modeLabel = isCorner ? '溢出角標（只露 1/3）' : '內嵌角標（完整）';

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="hero">
          <div class="hero__name">示範名稱</div>
          <div class="hero__meta">地區 · 公園 / 山徑</div>
          <div class="hero__weather hero__weather--${mode}">${weatherIcon(v.code, v.isDay)}</div>
        </div>
        <div class="label">${v.name}</div>
        <div class="sub">WMO ${v.code} · <span class="mode">${modeLabel}</span></div>
      `;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
