<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天氣角標全效果預覽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      background: #fff; color: #000;
      padding: 28px 16px 56px;
      max-width: 960px; margin: 0 auto;
    }
    .hd { border-left: 10px solid #F6B81F; padding-left: 14px; margin-bottom: 6px; }
    h1 { font-family: 'Josefin Sans', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.15; }
    .subhead { font-size: 13px; opacity: 0.6; margin: 6px 0 24px 24px; }
    .legend { font-size: 12px; opacity: 0.7; margin: 0 0 20px 24px; line-height: 1.7; }
    .legend b { font-weight: 700; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card { border: 1px solid #000; background: #fff; }

    .hero {
      position: relative; overflow: hidden;
      background: #fff; border-bottom: 1px solid #000;
      border-left: 8px solid #000;
      padding: 16px 14px; height: 122px;
    }
    .hero__name {
      position: relative; z-index: 1;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 18px; font-weight: 700; line-height: 1.2;
    }
    .hero__meta {
      position: relative; z-index: 1;
      font-size: 12px; opacity: 0.5; margin-top: 8px;
    }

    /* 與 components.css 完全一致的角標定位 */
    .hero__weather { position: absolute; z-index: 0; pointer-events: none; }
    .hero__weather--corner { top: -64px; right: -64px; width: 150px; height: 150px; }
    .hero__weather--inline { top: 12px; right: 12px; width: 56px; height: 56px; }
    .hero__weather svg { width: 100%; height: 100%; display: block; }

    .label {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 14px; font-weight: 700;
      padding: 10px 12px 2px;
    }
    .sub { font-size: 11px; padding: 2px 12px 12px; opacity: 0.6; line-height: 1.6; }
    .sub .mode { color: #000; font-weight: 700; opacity: 1; }

    /* 天氣動效（與 components.css 一致） */
    .weather-sun-rays { transform-box: fill-box; transform-origin: center; animation: weather-spin 28s linear infinite; }
    .weather-cloud-drift { transform-box: fill-box; transform-origin: center; animation: weather-billow 7s ease-in-out infinite; }
    .weather-rain { animation: weather-rain-fall 1s linear infinite; }
    .weather-rain.weather-slow { animation-duration: 1.7s; }
    .weather-rain.weather-fast { animation-duration: 0.65s; }
    .weather-lightning { animation: weather-flash 2.6s linear infinite; }
    .weather-fog { animation: weather-fog-drift 5s ease-in-out infinite; }
    .weather-star { animation: weather-twinkle 2.4s ease-in-out infinite; }
    .weather-d2 { animation-delay: 0.35s; }
    .weather-d3 { animation-delay: 0.7s; }
    .weather-d4 { animation-delay: 1.05s; }
    .weather-d5 { animation-delay: 1.4s; }
    @keyframes weather-spin { to { transform: rotate(360deg); } }
    @keyframes weather-billow { 0%, 100% { transform: translateX(0) scale(1); } 50% { transform: translateX(9px) scale(1.08); } }
    @keyframes weather-rain-fall { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(46px); opacity: 0; } }
    @keyframes weather-flash { 0%, 55%, 100% { opacity: 0.15; } 60%, 68% { opacity: 1; } 72% { opacity: 0.3; } 78%, 82% { opacity: 1; } 86% { opacity: 0.2; } }
    @keyframes weather-fog-drift { 0%, 100% { transform: translateX(0); opacity: 0.7; } 50% { transform: translateX(14px); opacity: 1; } }
    @keyframes weather-twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    .weather-wind { animation: weather-wind-flow 2.2s ease-in-out infinite; }
    .weather-typhoon { transform-box: fill-box; transform-origin: center; animation: weather-spin 7s linear infinite; }
    @keyframes weather-wind-flow { 0%, 100% { transform: translateX(0); opacity: 0.85; } 50% { transform: translateX(13px); opacity: 1; } }
  </style>
</head>
<body>
  <div class="hd"><h1>天氣角標 · 全效果預覽</h1></div>
  <div class="subhead">詳情頁 hero 右上角實時天氣角標 · 自包含可離線開啟（SVG 快照自 <code>js/core/weather-icons.js</code>）</div>
  <div class="legend">
    <b>溢出角標</b>：白天晴天（太陽只露約 1/3，被 hero 裁切）<br />
    <b>內嵌角標</b>：其餘天氣（月亮／雲／霧／雨／雷暴／風／颱風）完整展現
  </div>

  <div class="grid" id="grid"></div>

  <script>
    // ============ 天氣 SVG 生成（快照自 js/core/weather-icons.js） ============
    const BLACK = '#000000';
    const YELLOW = '#F6B81F';
    const BLUE = '#354A67';
    const GRAY = '#8A7F72';
    const PURPLE = '#7847AC';

    const CLOUD = "M 52 128 C 42 128 42 112 52 108 C 46 96 56 86 66 90 C 64 74 78 66 88 74 C 90 60 110 60 116 72 C 124 64 138 70 138 82 C 150 78 158 90 152 100 C 160 108 156 124 144 128 C 138 136 120 136 114 130 C 104 138 86 138 80 130 C 70 136 56 134 52 128 Z";

    function cloud(pos) {
      const t = pos ? ` transform="${pos}"` : '';
      return `<g${t}><g class="weather-cloud-drift"><path d="${CLOUD}" fill="${BLUE}" stroke="${BLACK}" stroke-width="4"/></g></g>`;
    }

    function sunRays() {
      const angles = [0, 45, 90, 135, 180, 225, 270, 315];
      const inner = 56, outer = 72, cx = 100, cy = 100;
      let lines = '';
      for (const a of angles) {
        const r = a * Math.PI / 180;
        const x1 = cx + inner * Math.cos(r), y1 = cy - inner * Math.sin(r);
        const x2 = cx + outer * Math.cos(r), y2 = cy - outer * Math.sin(r);
        lines += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
      }
      return lines;
    }

    function sunSVG() {
      return `<svg viewBox="0 0 200 200"><g class="weather-sun-rays"><g stroke="${YELLOW}" stroke-width="5" stroke-linecap="round">${sunRays()}</g></g><circle cx="100" cy="100" r="42" fill="${YELLOW}" stroke="${BLACK}" stroke-width="4"/></svg>`;
    }

    function crescentPath(cx, cy, r) {
      const R1 = r, R2 = r * 0.88, d = r * 0.55;
      const o1x = cx - d / 2;
      const a = (R1 * R1 - R2 * R2 + d * d) / (2 * d);
      const h = Math.sqrt(R1 * R1 - a * a);
      const ix = o1x + a;
      return `M ${ix.toFixed(1)} ${(cy - h).toFixed(1)} A ${R1} ${R1} 0 1 0 ${ix.toFixed(1)} ${(cy + h).toFixed(1)} A ${R2} ${R2} 0 0 1 ${ix.toFixed(1)} ${(cy - h).toFixed(1)} Z`;
    }

    function drops(n, speed, x0, gap, y1, y2) {
      let s = '';
      const delays = ['', 'weather-d2', 'weather-d3', 'weather-d4', 'weather-d5'];
      for (let i = 0; i < n; i++) {
        const x = x0 + i * gap;
        s += `<line class="weather-rain ${speed} ${delays[i % 5]}" x1="${x}" y1="${y1}" x2="${x - 8}" y2="${y2}"/>`;
      }
      return s;
    }

    function rainIcon(n, speed, w, x0, gap, y1, y2) {
      return `<svg viewBox="0 0 200 200">${cloud('translate(0 -30)')}<g stroke="${BLUE}" stroke-width="${w}" stroke-linecap="round">${drops(n, speed, x0, gap, y1, y2)}</g></svg>`;
    }

    function overcastIcon() {
      return `<svg viewBox="0 0 200 200">${cloud('translate(0 -6)')}</svg>`;
    }

    function partlyDayIcon() {
      return `<svg viewBox="0 0 200 200"><circle cx="100" cy="76" r="40" fill="${YELLOW}" stroke="${BLACK}" stroke-width="4"/>${cloud('translate(0 16)')}</svg>`;
    }

    function partlyNightIcon() {
      return `<svg viewBox="0 0 200 200"><path d="${crescentPath(100, 76, 42)}" fill="${YELLOW}" stroke="${BLACK}" stroke-width="4" stroke-linejoin="round"/>${cloud('translate(0 16)')}</svg>`;
    }

    function fogIcon() {
      return `<svg viewBox="0 0 200 200"><g stroke="${GRAY}" stroke-width="6" stroke-linecap="round"><line class="weather-fog" x1="40" y1="80" x2="160" y2="80"/><line class="weather-fog weather-d2" x1="55" y1="108" x2="150" y2="108"/><line class="weather-fog weather-d3" x1="40" y1="136" x2="165" y2="136"/></g></svg>`;
    }

    function thunderIcon() {
      return `<svg viewBox="0 0 200 200"><polygon class="weather-lightning" points="110,56 62,114 86,114 76,150 130,86 102,86" fill="${YELLOW}" stroke="${BLACK}" stroke-width="4" stroke-linejoin="round"/>${cloud('translate(0 -30)')}<g stroke="${BLUE}" stroke-width="7" stroke-linecap="round"><line class="weather-rain weather-fast" x1="50" y1="138" x2="42" y2="162"/><line class="weather-rain weather-fast weather-d2" x1="70" y1="138" x2="62" y2="162"/><line class="weather-rain weather-fast weather-d3" x1="90" y1="138" x2="82" y2="162"/><line class="weather-rain weather-fast weather-d4" x1="110" y1="138" x2="102" y2="162"/><line class="weather-rain weather-fast weather-d5" x1="130" y1="138" x2="122" y2="162"/><line class="weather-rain weather-fast weather-d2" x1="150" y1="138" x2="142" y2="162"/></g></svg>`;
    }

    function nightClearIcon() {
      return `<svg viewBox="0 0 200 200"><path d="${crescentPath(100, 100, 48)}" fill="${YELLOW}" stroke="${BLACK}" stroke-width="4" stroke-linejoin="round"/><circle class="weather-star" cx="152" cy="92" r="3.5" fill="${YELLOW}"/><circle class="weather-star weather-d2" cx="144" cy="128" r="2.5" fill="${YELLOW}"/><circle class="weather-star weather-d3" cx="160" cy="52" r="3" fill="${YELLOW}"/><circle class="weather-star weather-d4" cx="30" cy="104" r="3" fill="${YELLOW}"/><circle class="weather-star weather-d5" cx="38" cy="162" r="2.5" fill="${YELLOW}"/><circle class="weather-star weather-d2" cx="64" cy="34" r="4" fill="${YELLOW}"/><circle class="weather-star weather-d3" cx="126" cy="28" r="2.5" fill="${YELLOW}"/></svg>`;
    }

    function weatherIcon(code, isDay) {
      if (code == null) return '';
      if (code === 0 || code === 1) return isDay ? sunSVG() : nightClearIcon();
      if (code === 2) return isDay ? partlyDayIcon() : partlyNightIcon();
      if (code === 3) return overcastIcon();
      if (code === 45 || code === 48) return fogIcon();
      if (code === 51 || code === 53 || code === 55 || code === 56 || code === 57 ||
          code === 61 || code === 80 || code === 71 || code === 77 || code === 85) {
        return rainIcon(2, 'weather-slow', 5, 90, 30, 122, 144);
      }
      if (code === 63 || code === 66 || code === 81 || code === 73 || code === 86) {
        return rainIcon(4, '', 6, 66, 22, 122, 146);
      }
      if (code === 65 || code === 67 || code === 82 || code === 75) {
        return rainIcon(5, 'weather-fast', 7, 62, 19, 120, 148);
      }
      if (code === 95 || code === 96 || code === 99) return thunderIcon();
      return '';
    }

    function windIcon() {
      return `<svg viewBox="0 0 200 200"><g fill="none" stroke="${BLUE}" stroke-width="5" stroke-linecap="round"><path class="weather-wind" d="M38 78 Q 68 68 98 80 T 162 78"/><path class="weather-wind weather-d2" d="M50 103 Q 80 93 110 105 T 174 103"/><path class="weather-wind weather-d3" d="M62 128 Q 92 118 122 130 T 186 128"/></g></svg>`;
    }

    function spiralPath() {
      const cx = 100, cy = 100, turns = 2.6, maxR = 72, N = 150;
      let d = '';
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const r = maxR * t;
        const ang = t * turns * 2 * Math.PI - Math.PI / 2;
        const x = cx + r * Math.cos(ang), y = cy + r * Math.sin(ang);
        d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
      }
      return d;
    }

    function typhoonIcon() {
      return `<svg viewBox="0 0 200 200"><path class="weather-typhoon" d="${spiralPath()}" fill="none" stroke="${PURPLE}" stroke-width="7" stroke-linecap="round"/></svg>`;
    }

    // ============ 渲染 ============
    const variants = [
      { name: '晴 · 白天', code: 0,  isDay: true  },
      { name: '晴 · 夜晚', code: 0,  isDay: false },
      { name: '多雲 · 白天', code: 2,  isDay: true  },
      { name: '多雲 · 夜晚', code: 2,  isDay: false },
      { name: '陰',        code: 3,  isDay: true  },
      { name: '霧',        code: 45, isDay: true  },
      { name: '小雨',      code: 61, isDay: true  },
      { name: '中雨',      code: 63, isDay: true  },
      { name: '大雨',      code: 65, isDay: true  },
      { name: '雷暴',      code: 95, isDay: true  },
    ];

    const grid = document.getElementById('grid');

    function makeCard(name, sub, iconHTML, mode) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="hero">
          <div class="hero__name">示範名稱</div>
          <div class="hero__meta">地區 · 公園 / 山徑</div>
          <div class="hero__weather hero__weather--${mode}">${iconHTML}</div>
        </div>
        <div class="label">${name}</div>
        <div class="sub">${sub}</div>
      `;
      grid.appendChild(card);
    }

    for (const v of variants) {
      const isCorner = v.isDay && (v.code === 0 || v.code === 1);
      const mode = isCorner ? 'corner' : 'inline';
      const modeLabel = isCorner ? '溢出角標（只露 1/3）' : '內嵌角標（完整）';
      makeCard(v.name, `WMO ${v.code} · <span class="mode">${modeLabel}</span>`, weatherIcon(v.code, v.isDay), mode);
    }

    // 額外（非 WMO 碼）
    makeCard('刮風', '風力線條 · 已上線（風速 ≥ 40 km/h）', windIcon(), 'inline');
    makeCard('颱風', '紫色旋渦 · 已上線（HKO 風球信號）', typhoonIcon(), 'inline');
  </script>
</body>
</html>
