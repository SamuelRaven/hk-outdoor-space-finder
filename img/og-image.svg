<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- 包豪斯风格 OG 分享图 -->
  <rect width="1200" height="630" fill="#F5F0E8"/>

  <!-- 黑色边框 -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#111" stroke-width="4"/>

  <!-- 左侧红圆 -->
  <circle cx="280" cy="280" r="140" fill="#D43D2E" stroke="#111" stroke-width="4"/>

  <!-- 右侧蓝方 -->
  <rect x="680" y="140" width="260" height="260" fill="#1A3A8F" stroke="#111" stroke-width="4"/>

  <!-- 顶部黄三角 -->
  <polygon points="450,50 680,420 220,420" fill="#F2C820" stroke="#111" stroke-width="4"/>

  <!-- 底部装饰线 -->
  <rect x="20" y="610" width="1160" height="4" fill="#111"/>
  <rect x="20" y="616" width="310" height="4" fill="#D43D2E"/>
  <rect x="334" y="616" width="310" height="4" fill="#1A3A8F"/>
  <rect x="648" y="616" width="310" height="4" fill="#F2C820"/>
  <rect x="962" y="616" width="218" height="4" fill="#111"/>
</svg>
