<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港戶外空間推薦</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

  <!-- Open Graph — 分享連結時預覽卡片 -->
  <meta property="og:title" content="香港戶外空間推薦">
  <meta property="og:description" content="幫你揀最啱嘅戶外好去處">
  <meta property="og:image" content="https://samuelraven.github.io/hk-outdoor-space-finder/img/og-image.png">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="600">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_HK">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://samuelraven.github.io/hk-outdoor-space-finder/img/og-image.png">

  <!-- Google Fonts: Josefin Sans (display) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/bauhaus-tokens.css?v=5">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css?v=1">
  <link rel="stylesheet" href="css/components.css?v=47">
</head>
<body>

  <div class="app-container">

    <!-- Page 1: Landing -->
    <section id="page-landing" class="page page--active">
      <div class="landing">
        <!-- Bauhaus 背景装饰 -->
        <div class="bauhaus-bg">
          <div class="bauhaus-bg__circle"></div>
          <div class="bauhaus-bg__square--blue-fill"></div>
          <div class="bauhaus-bg__triangle"></div>
          <div class="bauhaus-bg__stripe--red"></div>
          <div class="bauhaus-bg__dot--blue"></div>
          <div class="bauhaus-bg__arc"></div>
          <div class="bauhaus-bg__diamond"></div>
          <div class="bauhaus-bg__cross"></div>
        </div>
        <div class="landing__header">
          <h1 class="landing__title">香港<br>戶外空間</h1>
          <p class="landing__subtitle">Outdoor Space Finder</p>
        </div>

        <div class="landing__actions">
          <button class="btn btn-primary" data-action="parks">
            散散步吹吹風
          </button>
          <button class="btn btn-secondary" data-action="hiking">
            徒步登山大出汗
          </button>
        </div>

        <!-- Bauhaus 几何装饰 -->
        <div class="landing__decor">
          <div class="decor decor--circle"></div>
          <div class="decor decor--triangle"></div>
          <div class="decor decor--square"></div>
        </div>
      </div>
    </section>

    <!-- Page 2: Filters -->
    <section id="page-filter" class="page">
      <div class="filter-page">

        <!-- Bauhaus 背景装饰 -->
        <div class="bauhaus-bg">
          <div class="bauhaus-bg__circle"></div>
          <div class="bauhaus-bg__square"></div>
          <div class="bauhaus-bg__stripe"></div>
          <div class="bauhaus-bg__triangle"></div>
          <div class="bauhaus-bg__dot--blue"></div>
          <div class="bauhaus-bg__line"></div>
          <div class="bauhaus-bg__corner"></div>
          <div class="bauhaus-bg__dot--red"></div>
          <div class="bauhaus-bg__square--black"></div>
          <div class="bauhaus-bg__circle--yellow"></div>
          <div class="bauhaus-bg__diamond"></div>
          <div class="bauhaus-bg__half-circle"></div>
          <div class="bauhaus-bg__diagonal"></div>
          <div class="bauhaus-bg__cross"></div>
          <div class="bauhaus-bg__stripe--blue"></div>
          <div class="bauhaus-bg__dot"></div>
        </div>

        <!-- 顶部栏 -->
        <div class="filter-page__header">
          <button class="back-btn" data-action="back">←</button>
          <h2 class="filter-page__title">揀個公園Hea</h2>
        </div>

        <!-- 筛选网格：3列2行 -->
        <div class="filter-grid">
          <!-- 第1行第1列 -->
          <button class="filter-btn" data-filter="region" data-selected="">
            <span class="filter-btn__label">地區</span>
            <span class="filter-btn__value">選擇</span>
          </button>

          <!-- 第1行第2列 -->
          <button class="filter-btn" data-filter="time" data-selected="">
            <span class="filter-btn__label">時間</span>
            <span class="filter-btn__value">選擇</span>
          </button>

          <!-- 第1-2行第3列：GO! + Reset! 堆叠 -->
          <div class="go-reset-stack">
            <button class="go-btn" data-action="go">GO!</button>
            <button class="reset-btn" data-action="reset">Reset!</button>
          </div>

          <!-- 第2行第1列 -->
          <button class="filter-btn" data-filter="parkType" data-selected="">
            <span class="filter-btn__label">公園類型</span>
            <span class="filter-btn__value">選擇</span>
          </button>

          <!-- 第2行第2列 -->
          <button class="filter-btn" data-filter="activity" data-selected="">
            <span class="filter-btn__label">做點什麼</span>
            <span class="filter-btn__value">選擇</span>
          </button>
        </div>

        <!-- 选项弹出区：chips 容器 -->
        <div class="filter-options" id="filter-options"></div>

        <!-- 盲盒按钮 -->
        <button class="blindbox-btn" data-action="blindbox">?</button>

        <!-- 收藏按钮 -->
        <button class="fav-entry-btn" data-action="fav-parks">★</button>

      </div>
    </section>

    <!-- Page 3: Results -->
    <section id="page-results" class="page">
      <div class="results-page">

        <!-- Bauhaus 背景装饰 -->
        <div class="bauhaus-bg">
          <div class="bauhaus-bg__square--blue-fill"></div>
          <div class="bauhaus-bg__stripe"></div>
          <div class="bauhaus-bg__circle--red-fill"></div>
          <div class="bauhaus-bg__line"></div>
          <div class="bauhaus-bg__cross"></div>
          <div class="bauhaus-bg__dot--red"></div>
          <div class="bauhaus-bg__stripe--black"></div>
          <div class="bauhaus-bg__circle--yellow"></div>
          <div class="bauhaus-bg__square--black"></div>
          <div class="bauhaus-bg__line--red"></div>
        </div>
        <div class="results-page__header">
          <button class="back-btn" data-action="back">←</button>
          <h2 class="results-page__title">最啱你嘅公園</h2>
          <button class="sort-distance" id="park-sort-distance" aria-label="按距離排序" title="按距離排序">
            <svg width="42" height="14" viewBox="0 0 42 14" class="sort-distance__icon">
              <circle cx="7" cy="7" r="5" class="sort-distance__c sort-distance__c--red"/>
              <circle cx="21" cy="7" r="5" class="sort-distance__c sort-distance__c--yellow"/>
              <circle cx="35" cy="7" r="5" class="sort-distance__c sort-distance__c--blue"/>
            </svg>
          </button>
          <span class="results-page__count" id="results-count"></span>
        </div>
        <div class="results-list" id="results-list">
          <!-- 公园卡片由 JS 动态渲染 -->
        </div>
        <div class="pagination" id="park-pagination"></div>
        <div class="results-page__empty" id="results-empty" style="display:none;">
          <p>暫無匹配的公園</p>
          <p class="results-page__hint">試著放寬篩選條件吧～</p>
        </div>
      </div>
    </section>

    <!-- Page 4: Blind Box -->
    <section id="page-blindbox" class="page">
      <div class="blindbox-page">

        <!-- Bauhaus 背景装饰 -->
        <div class="bauhaus-bg">
          <div class="bauhaus-bg__circle"></div>
          <div class="bauhaus-bg__arc"></div>
          <div class="bauhaus-bg__stripe--red"></div>
          <div class="bauhaus-bg__stripe--blue"></div>
          <div class="bauhaus-bg__dot--red"></div>
          <div class="bauhaus-bg__cross"></div>
          <div class="bauhaus-bg__square--black"></div>
          <div class="bauhaus-bg__circle--yellow"></div>
          <div class="bauhaus-bg__diamond"></div>
          <div class="bauhaus-bg__half-circle"></div>
          <div class="bauhaus-bg__diagonal"></div>
          <div class="bauhaus-bg__triangle"></div>
          <div class="bauhaus-bg__dot"></div>
          <div class="bauhaus-bg__line"></div>
        </div>
        <button class="back-btn" data-action="back">←</button>

        <div class="blindbox-page__stage" id="bb-stage">
          <!-- 骰子文字 -->
          <p class="blindbox-page__text">命運已擲出骰子<br>你今日要前往<span style="letter-spacing:0.15em;">...</span></p>

          <!-- 骰子动画区 -->
          <div class="dice-cube" id="dice-cube">
            <div class="dice-face dice-face--front">■</div>
            <div class="dice-face dice-face--back">▲</div>
            <div class="dice-face dice-face--top">●</div>
            <div class="dice-face dice-face--bottom">◆</div>
            <div class="dice-face dice-face--left">◼</div>
            <div class="dice-face dice-face--right">⬟</div>
          </div>
        </div>

        <!-- 结果卡片（初始隐藏） -->
        <div class="blindbox-page__result" id="bb-result" style="display:none;">
        </div>

        <button class="btn btn-secondary blindbox-page__retry" id="bb-retry" style="display:none;">
          再投一次
        </button>
      </div>
    </section>

    <!-- Page 5: Dice Tired（骰子累了） -->
    <section id="page-dice-tired" class="page">
      <div class="dice-tired-page">

        <!-- Bauhaus 背景装饰 -->
        <div class="bauhaus-bg">
          <div class="bauhaus-bg__circle--red-fill"></div>
          <div class="bauhaus-bg__stripe--red"></div>
          <div class="bauhaus-bg__stripe--blue"></div>
          <div class="bauhaus-bg__dot--blue"></div>
          <div class="bauhaus-bg__line"></div>
          <div class="bauhaus-bg__square--black"></div>
          <div class="bauhaus-bg__cross"></div>
          <div class="bauhaus-bg__dot--red"></div>
          <div class="bauhaus-bg__triangle"></div>
          <div class="bauhaus-bg__square--blue-fill"></div>
          <div class="bauhaus-bg__half-circle"></div>
          <div class="bauhaus-bg__diamond"></div>
        </div>
        <div class="dice-tired-page__inner">
          <p class="dice-tired-page__text">骰子累了<br>暫時不想轉了~</p>
          <button class="btn btn-primary dice-tired-page__btn" data-action="tomorrow">
            請明日再來吧
          </button>
        </div>
      </div>
    </section>

    <!-- Page 6: Hiking Filter（徒步筛选页） -->
    <section id="page-hiking-filter" class="page">
      <div class="filter-page">

        <!-- Bauhaus 背景装饰 -->
        <div class="bauhaus-bg">
          <div class="bauhaus-bg__circle"></div>
          <div class="bauhaus-bg__square"></div>
          <div class="bauhaus-bg__stripe"></div>
          <div class="bauhaus-bg__triangle"></div>
          <div class="bauhaus-bg__dot--blue"></div>
          <div class="bauhaus-bg__line"></div>
          <div class="bauhaus-bg__corner"></div>
          <div class="bauhaus-bg__dot--red"></div>
          <div class="bauhaus-bg__square--black"></div>
          <div class="bauhaus-bg__circle--yellow"></div>
          <div class="bauhaus-bg__diamond"></div>
          <div class="bauhaus-bg__half-circle"></div>
          <div class="bauhaus-bg__diagonal"></div>
          <div class="bauhaus-bg__cross"></div>
          <div class="bauhaus-bg__stripe--blue"></div>
          <div class="bauhaus-bg__dot"></div>
        </div>
        <div class="filter-page__header">
          <button class="back-btn" data-action="back">←</button>
          <h2 class="filter-page__title">揀條山徑出发</h2>
        </div>

        <div class="filter-grid" id="hiking-filter-grid">
          <!-- 第1行第1列 -->
          <button class="filter-btn" data-filter="region" data-selected="">
            <span class="filter-btn__label">地區</span>
            <span class="filter-btn__value">選擇</span>
          </button>

          <!-- 第1行第2列 -->
          <button class="filter-btn" data-filter="difficulty" data-selected="">
            <span class="filter-btn__label">難度</span>
            <span class="filter-btn__value">選擇</span>
          </button>

          <!-- 第1-2行第3列：GO! + Reset! 堆叠 -->
          <div class="go-reset-stack">
            <button class="go-btn go-btn--hike" data-action="go">GO!</button>
            <button class="reset-btn" data-action="reset">Reset!</button>
          </div>

          <!-- 第2行第1列 -->
          <button class="filter-btn" data-filter="scenery" data-selected="">
            <span class="filter-btn__label">氛圍</span>
            <span class="filter-btn__value">選擇</span>
          </button>

          <!-- 第2行第2列 -->
          <button class="filter-btn" data-filter="surface" data-selected="">
            <span class="filter-btn__label">路況</span>
            <span class="filter-btn__value">選擇</span>
          </button>
        </div>

        <!-- 选项弹出区 -->
        <div class="filter-options" id="hiking-filter-options"></div>

        <!-- 盲盒按钮 -->
        <button class="blindbox-btn blindbox-btn--hike" data-action="hiking-blindbox">?</button>

        <!-- 收藏按钮 -->
        <button class="fav-entry-btn fav-entry-btn--hike" data-action="fav-trails">★</button>
      </div>
    </section>

    <!-- Page 7: Hiking Results（徒步结果页） -->
    <section id="page-hiking-results" class="page">
      <div class="results-page">

        <!-- Bauhaus 背景装饰 -->
        <div class="bauhaus-bg">
          <div class="bauhaus-bg__square--blue-fill"></div>
          <div class="bauhaus-bg__stripe"></div>
          <div class="bauhaus-bg__circle--red-fill"></div>
          <div class="bauhaus-bg__line"></div>
          <div class="bauhaus-bg__cross"></div>
          <div class="bauhaus-bg__dot--red"></div>
          <div class="bauhaus-bg__stripe--black"></div>
          <div class="bauhaus-bg__circle--yellow"></div>
          <div class="bauhaus-bg__square--black"></div>
          <div class="bauhaus-bg__line--red"></div>
        </div>
        <div class="results-page__header">
          <button class="back-btn" data-action="back">←</button>
          <h2 class="results-page__title">今日行呢度</h2>
          <button class="sort-distance" id="trail-sort-distance" aria-label="按距離排序" title="按距離排序">
            <svg width="42" height="14" viewBox="0 0 42 14" class="sort-distance__icon">
              <circle cx="7" cy="7" r="5" class="sort-distance__c sort-distance__c--red"/>
              <circle cx="21" cy="7" r="5" class="sort-distance__c sort-distance__c--yellow"/>
              <circle cx="35" cy="7" r="5" class="sort-distance__c sort-distance__c--blue"/>
            </svg>
          </button>
          <span class="results-page__count" id="hiking-results-count"></span>
        </div>
        <!-- 根据筛选条件显示的统一安全提示 -->
        <div class="results-notice" id="hiking-results-notice" style="display:none;"></div>

        <div class="results-list" id="hiking-results-list">
          <!-- 山径卡片由 JS 动态渲染 -->
        </div>
        <div class="pagination" id="hiking-pagination"></div>
        <div class="results-page__empty" id="hiking-results-empty" style="display:none;">
          <p>暫無匹配的山徑</p>
          <p class="results-page__hint">試著放寬篩選條件吧～</p>
        </div>
      </div>
    </section>

    <!-- Page 8: Hiking Blind Box（徒步盲盒页） -->
    <section id="page-hiking-blindbox" class="page">
      <div class="blindbox-page">

        <!-- Bauhaus 背景装饰 -->
        <div class="bauhaus-bg">
          <div class="bauhaus-bg__circle"></div>
          <div class="bauhaus-bg__arc"></div>
          <div class="bauhaus-bg__stripe--red"></div>
          <div class="bauhaus-bg__stripe--blue"></div>
          <div class="bauhaus-bg__dot--red"></div>
          <div class="bauhaus-bg__cross"></div>
          <div class="bauhaus-bg__square--black"></div>
          <div class="bauhaus-bg__circle--yellow"></div>
          <div class="bauhaus-bg__diamond"></div>
          <div class="bauhaus-bg__half-circle"></div>
          <div class="bauhaus-bg__diagonal"></div>
          <div class="bauhaus-bg__triangle"></div>
          <div class="bauhaus-bg__dot"></div>
          <div class="bauhaus-bg__line"></div>
        </div>
        <button class="back-btn" data-action="back">←</button>

        <div class="blindbox-page__stage" id="hiking-bb-stage">
          <p class="blindbox-page__text">命運已擲出骰子<br>你今日要行<span style="letter-spacing:0.15em;">...</span></p>

          <div class="dice-cube" id="hiking-dice-cube">
            <div class="dice-face dice-face--front">■</div>
            <div class="dice-face dice-face--back">▲</div>
            <div class="dice-face dice-face--top">●</div>
            <div class="dice-face dice-face--bottom">◆</div>
            <div class="dice-face dice-face--left">◼</div>
            <div class="dice-face dice-face--right">⬟</div>
          </div>
        </div>

        <div class="blindbox-page__result" id="hiking-bb-result" style="display:none;">
        </div>

        <button class="btn btn-secondary blindbox-page__retry" id="hiking-bb-retry" style="display:none;">
          再投一次
        </button>
      </div>
    </section>

    <!-- Page 9: Park Detail -->
    <section id="page-park-detail" class="page">
      <div class="detail-page">
        <div class="bauhaus-bg">
          <div class="bauhaus-bg__circle"></div>
          <div class="bauhaus-bg__square--black"></div>
          <div class="bauhaus-bg__dot--red"></div>
          <div class="bauhaus-bg__line"></div>
          <div class="bauhaus-bg__corner"></div>
          <div class="bauhaus-bg__diamond"></div>
          <div class="bauhaus-bg__half-circle"></div>
          <div class="bauhaus-bg__circle--red-fill"></div>
          <div class="bauhaus-bg__triangle"></div>
          <div class="bauhaus-bg__stripe--blue"></div>
          <div class="bauhaus-bg__dot"></div>
          <div class="bauhaus-bg__arc"></div>
          <div class="bauhaus-bg__line--red"></div>
          <div class="bauhaus-bg__square"></div>
        </div>
        <div class="detail-page__header">
          <button class="back-btn" data-action="back">←</button>
          <h2 class="detail-page__title">公園詳情</h2>
        </div>
        <div class="detail-page__content" id="park-detail-content"></div>
      </div>
    </section>

    <!-- Page 10: Trail Detail -->
    <section id="page-trail-detail" class="page">
      <div class="detail-page">
        <div class="bauhaus-bg">
          <div class="bauhaus-bg__circle--yellow"></div>
          <div class="bauhaus-bg__stripe"></div>
          <div class="bauhaus-bg__dot--blue"></div>
          <div class="bauhaus-bg__cross"></div>
          <div class="bauhaus-bg__square--black"></div>
          <div class="bauhaus-bg__diamond"></div>
          <div class="bauhaus-bg__diagonal"></div>
          <div class="bauhaus-bg__circle--red-fill"></div>
          <div class="bauhaus-bg__triangle"></div>
          <div class="bauhaus-bg__stripe--blue"></div>
          <div class="bauhaus-bg__dot"></div>
          <div class="bauhaus-bg__arc"></div>
          <div class="bauhaus-bg__line--red"></div>
          <div class="bauhaus-bg__square"></div>
        </div>
        <div class="detail-page__header">
          <button class="back-btn" data-action="back">←</button>
          <h2 class="detail-page__title">山徑詳情</h2>
        </div>
        <div class="detail-page__content" id="trail-detail-content"></div>
      </div>
    </section>

    <!-- Page 11: Fav Parks（公園收藏） -->
    <section id="page-fav-parks" class="page">
      <div class="results-page">

        <!-- Bauhaus 背景装饰 -->
        <div class="bauhaus-bg">
          <div class="bauhaus-bg__square--blue-fill"></div>
          <div class="bauhaus-bg__stripe"></div>
          <div class="bauhaus-bg__circle--red-fill"></div>
          <div class="bauhaus-bg__line"></div>
          <div class="bauhaus-bg__cross"></div>
          <div class="bauhaus-bg__dot--red"></div>
          <div class="bauhaus-bg__stripe--black"></div>
          <div class="bauhaus-bg__circle--yellow"></div>
          <div class="bauhaus-bg__square--black"></div>
          <div class="bauhaus-bg__line--red"></div>
        </div>
        <div class="results-page__header">
          <button class="back-btn" data-action="back">←</button>
          <h2 class="results-page__title">我的公園收藏</h2>
          <span class="results-page__count" id="fav-parks-count"></span>
        </div>
        <div class="results-page__list" id="fav-parks-list"></div>
        <div class="results-page__empty" id="fav-parks-empty" style="display:none;">
          <p>還未收藏任何公園</p>
          <p>去公園詳情頁點 ★ 收藏吧～</p>
        </div>
      </div>
    </section>

    <!-- Page 12: Fav Trails（山徑收藏） -->
    <section id="page-fav-trails" class="page">
      <div class="results-page">

        <!-- Bauhaus 背景装饰 -->
        <div class="bauhaus-bg">
          <div class="bauhaus-bg__square--blue-fill"></div>
          <div class="bauhaus-bg__stripe"></div>
          <div class="bauhaus-bg__circle--red-fill"></div>
          <div class="bauhaus-bg__line"></div>
          <div class="bauhaus-bg__cross"></div>
          <div class="bauhaus-bg__dot--red"></div>
          <div class="bauhaus-bg__stripe--black"></div>
          <div class="bauhaus-bg__circle--yellow"></div>
          <div class="bauhaus-bg__square--black"></div>
          <div class="bauhaus-bg__line--red"></div>
        </div>
        <div class="results-page__header">
          <button class="back-btn" data-action="back">←</button>
          <h2 class="results-page__title">我的山徑收藏</h2>
          <span class="results-page__count" id="fav-trails-count"></span>
